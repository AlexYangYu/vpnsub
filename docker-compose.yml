services:
  updater:
    build:
      context: .
    image: vpn-updater:1.0.0
    restart: always
    env_file:
      - .env
    environment:
      BASE_CONFIG_PATH: /app/config/LAZod.yaml
      DATA_DIR: /data
      MIHOMO_PATH: /usr/local/bin/mihomo
    volumes:
      - ./LAZod.yaml:/app/config/LAZod.yaml:ro
      - ./data:/data
    network_mode: host
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,nosuid,nodev,noexec
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - apparmor=unconfined
    pids_limit: 128
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5)"
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
